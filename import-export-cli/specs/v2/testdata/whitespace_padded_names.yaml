swagger: "2.0"
info: {title: WhitespacePaddedNames, version: 1.0.0}
paths:
  /test:
    get:
      security:
        - default: [" padded_scope "]
      responses: {"200": {description: OK}}
securityDefinitions:
  default:
    type: oauth2
    flow: implicit
    authorizationUrl: https://test.com
    scopes:
      " padded_scope ": " a description with padding "
    x-scopes-bindings:
      " padded_scope ": [" padded_role "]
